<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Food Manía</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Arial Black', Gadget, sans-serif;
    }

    /* Contenedor adaptado a la imagen de Canva */
    .menu-container {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* Proporción 16:9 para TV */
      max-height: 100vh;
      max-width: 177.78vh;
      background-image: url('fondo.jpg'); /* Nombre de la imagen de Canva subida a GitHub */
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    /* Estilo visual de los precios */
    .precio {
      position: absolute;
      color: #ffffff;
      font-size: 2vw;
      font-weight: bold;
      text-align: center;
      transform: translate(-50%, -50%);
    }

    /* Coordenadas para superponer cada precio sobre la plantilla */
    #perro_sencillo        { top: 16.5%; left: 35.5%; }
    #combo_5_perros        { top: 35.0%; left: 35.5%; }
    #combo_10_perros       { top: 52.0%; left: 35.5%; }
    #perro_especial        { top: 67.0%; left: 35.5%; }

    #criolla               { top: 16.5%; left: 68.0%; color: #800000; }
    #americana             { top: 30.5%; left: 68.0%; color: #800000; }
    #americana_bacon       { top: 44.5%; left: 68.0%; color: #800000; }
    #americana_bacon_doble  { top: 58.5%; left: 68.0%; color: #800000; }
    #callejera             { top: 72.5%; left: 68.0%; color: #800000; }
  </style>
</head>
<body>

  <div class="menu-container">
    <div id="perro_sencillo" class="precio"></div>
    <div id="combo_5_perros" class="precio"></div>
    <div id="combo_10_perros" class="precio"></div>
    <div id="perro_especial" class="precio"></div>

    <div id="criolla" class="precio"></div>
    <div id="americana" class="precio"></div>
    <div id="americana_bacon" class="precio"></div>
    <div id="americana_bacon_doble" class="precio"></div>
    <div id="callejera" class="precio"></div>
  </div>

  <script>
    // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT
    const API_URL = "https://script.google.com/macros/s/AKfycbwZKhKm9VunjgA5kJ3XLS_JIKDLi2aEqcFvwnS8D3pgqAx0FgmhCqAaBQ1LM5FOJn7M/exec";

    async function actualizarPrecios() {
      try {
        const res = await fetch(API_URL);
        const datos = await res.json();

        datos.forEach(item => {
          const elemento = document.getElementById(item.id);
          if (elemento) {
            // Si la hoja trae símbolo o formato lo pone, si no le antepone el $
            elemento.innerText = item.precio.includes('$') ? item.precio : '$ ' + item.precio;
          }
        });
      } catch (err) {
        console.error("Error al actualizar precios:", err);
      }
    }

    actualizarPrecios();
    setInterval(actualizarPrecios, 20000); // Se actualiza cada 20 segundos
  </script>
</body>
</html>
