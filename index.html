<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Food Manía</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Arial Black', Gadget, sans-serif;
    }

    .menu-container {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
      background-image: url('fondo.jpg');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .precio {
      position: absolute;
      font-size: 2vw;
      font-weight: 900;
      text-align: center;
      transform: translate(-50%, -50%);
    }

    /* Perros (Centrados en la pastilla roja) */
    .precio-perro {
      color: #ffffff;
    }
    #perro_sencillo        { top: 16.1%; left: 36.5%; }
    #combo_5_perros        { top: 36.6%; left: 36.5%; }
    #combo_10_perros       { top: 51.6%; left: 35.6%; }
    #perro_especial        { top: 60.5%; left: 36.5%; }

    /* Hamburguesas (Alineados a la izquierda de cada título) */
    .precio-hamburguesa {
      color: #9c0226;
    }
    #criolla               { top: 21.0%; left: 70.0%; }
    #americana             { top: 29.5%; left: 70.0%; }
    #americana_bacon       { top: 47.0%; left: 70.0%; }
    #americana_bacon_doble { top: 61.0%; left: 70.0%; }
    #callejera             { top: 74.0%; left: 70.0%; }
  </style>
</head>
<body>

  <div class="menu-container">
    <!-- Perros -->
    <div id="perro_sencillo" class="precio precio-perro"></div>
    <div id="combo_5_perros" class="precio precio-perro"></div>
    <div id="combo_10_perros" class="precio precio-perro"></div>
    <div id="perro_especial" class="precio precio-perro"></div>

    <!-- Hamburguesas -->
    <div id="criolla" class="precio precio-hamburguesa"></div>
    <div id="americana" class="precio precio-hamburguesa"></div>
    <div id="americana_bacon" class="precio precio-hamburguesa"></div>
    <div id="americana_bacon_doble" class="precio precio-hamburguesa"></div>
    <div id="callejera" class="precio precio-hamburguesa"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwZKhKm9VunjgA5kJ3XLS_JIKDLi2aEqcFvwnS8D3pgqAx0FgmhCqAaBQ1LM5FOJn7M/exec";

    async function actualizarPrecios() {
      try {
        const res = await fetch(API_URL);
        const datos = await res.json();

        datos.forEach(item => {
          const elemento = document.getElementById(item.id);
          if (elemento) {
            elemento.innerText = item.precio;
          }
        });
      } catch (err) {
        console.error("Error al actualizar precios:", err);
      }
    }

    actualizarPrecios();
    setInterval(actualizarPrecios, 20000);
  </script>
</body>
</html>
