<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Food Manía</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Arial Black', Gadget, sans-serif;
    }

    .menu-container {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
      background-image: url('fondo.jpg');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .precio {
      position: absolute;
      font-size: 2vw;
      font-weight: 900;
      text-align: center;
      transform: translate(-50%, -50%);
    }

    /* Perros */
    .precio-perro {
      color: #ffffff;
    }
    #perro_sencillo        { top: 21.0%; left: 38.3%; }
    #combo_5_perros        { top: 39.0%; left: 38.3%; }
    #combo_10_perros       { top: 55.5%; left: 38.3%; }
    #perro_especial        { top: 69.5%; left: 38.3%; }

    /* Hamburguesas */
    .precio-hamburguesa {
      color: #9c0226;
    }
    #criolla               { top: 21.0%; left: 65.5%; }
    #americana             { top: 32.5%; left: 65.5%; }
    #americana_bacon       { top: 47.0%; left: 65.5%; }
    #americana_bacon_doble { top: 61.0%; left: 65.5%; }
    #callejera             { top: 74.0%; left: 65.5%; }
  </style>
</head>
<body>

  <div class="menu-container">
    <div id="perro_sencillo" class="precio"></div>
    <div id="combo_5_perros" class="precio"></div>
    <div id="combo_10_perros" class="precio"></div>
    <div id="perro_especial" class="precio"></div>

    <div id="criolla" class="precio"></div>
    <div id="americana" class="precio"></div>
    <div id="americana_bacon" class="precio"></div>
    <div id="americana_bacon_doble" class="precio"></div>
    <div id="callejera" class="precio"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwZKhKm9VunjgA5kJ3XLS_JIKDLi2aEqcFvwnS8D3pgqAx0FgmhCqAaBQ1LM5FOJn7M/exec";

    async function actualizarPrecios() {
      try {
        const res = await fetch(API_URL);
        const datos = await res.json();

        datos.forEach(item => {
          const elemento = document.getElementById(item.id);
          if (elemento) {
            // Lee el precio directo de tu hoja
            elemento.innerText = item.precio;
          }
        });
      } catch (err) {
        console.error("Error al actualizar precios:", err);
      }
    }

    actualizarPrecios();
    setInterval(actualizarPrecios, 20000);
  </script>
</body>
</html>
